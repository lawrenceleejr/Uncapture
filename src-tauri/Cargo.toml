[package]
name = "uncapture"
version = "0.1.0"
description = "Clean up the Photos library: keep the best of each burst of photos, delete the rest"
edition = "2021"
default-run = "uncapture"

[[bin]]
name = "uncapture"
path = "src/main.rs"

[features]
default = ["gui"]
# The Mac app window. Without it the binary is the terminal + browser version
# only (`uncapture --serve`), which is what the tests and Linux CI use.
gui = ["dep:tauri", "dep:tauri-build"]

[dependencies]
tiny_http = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
include_dir = "0.7"
ctrlc = "3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tauri = { version = "2", optional = true, features = [] }

# PhotoKit: compiled only on macOS (the PhotoKitSource in src/photokit.rs).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "NSArray", "NSData", "NSDate", "NSDictionary", "NSEnumerator", "NSError", "NSObject", "NSString", "NSURL", "NSValue", "NSKeyValueCoding", "NSGeometry", "NSTimeZone"] }
objc2-photos = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-app-kit", "objc2-core-foundation", "PHAsset", "PHObject", "PHFetchOptions", "PHFetchResult", "PHImageManager", "PHPhotoLibrary", "PHAssetChangeRequest", "PHChangeRequest", "PHAssetResource", "PHAssetResourceManager", "PhotosTypes", "PHChange", "PHError", "dispatch2"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSGraphicsContext", "objc2-core-graphics", "objc2-core-foundation"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGImage"] }

[build-dependencies]
tauri-build = { version = "2", optional = true, features = [] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
